!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname leaf4
!
spanning-tree mode mstp
no spanning-tree vlan-id 4094
spanning-tree mst 0 priority 16384
!
vlan 10
   name DMZ
!
vlan 20
   name Internal
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel1
   description MLAG_leaf3_Port-Channel1
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Port-Channel3
   description L2_SPINES_Port-Channel5
   no shutdown
   switchport trunk allowed vlan 10,20
   switchport mode trunk
   switchport
   mlag 3
!
interface Port-Channel7
   description PortChannel host3
   no shutdown
   switchport access vlan 10
   switchport mode access
   switchport
   mlag 7
   spanning-tree portfast
!
interface Port-Channel9
   description PortChannel host4
   no shutdown
   switchport access vlan 20
   switchport mode access
   switchport
   mlag 9
   spanning-tree portfast
!
interface Ethernet1
   description MLAG_leaf3_Ethernet1
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description MLAG_leaf3_Ethernet2
   no shutdown
   channel-group 1 mode active
!
interface Ethernet3
   description L2_spine1_Ethernet6
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description L2_spine2_Ethernet6
   no shutdown
   channel-group 3 mode active
!
interface Ethernet7
   description SERVER_host3_Ethernet2
   no shutdown
   channel-group 7 mode active
!
interface Ethernet9
   description SERVER_host4_Ethernet2
   no shutdown
   channel-group 9 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.24/24
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.1.253.1/31
no ip routing vrf MGMT
!
mlag configuration
   domain-id mlag2
   local-interface Vlan4094
   peer-address 10.1.253.0
   peer-link Port-Channel1
   reload-delay mlag 300
   reload-delay non-mlag 330
!
end
