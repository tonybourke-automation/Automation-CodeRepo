!
no enable password
no aaa root
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname spine2
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 4096
!
vlan 10
   name DMZ
!
vlan 20
   name Internal
!
vlan 3009
   name MLAG_L3_VRF_VRF_A
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
vrf instance VRF_A
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel1
   description MLAG_spine1_Port-Channel1
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Port-Channel3
   description L2_mlag1_Port-Channel3
   no shutdown
   switchport trunk allowed vlan 10,20
   switchport mode trunk
   switchport
   mlag 3
!
interface Port-Channel5
   description L2_mlag2_Port-Channel3
   no shutdown
   switchport trunk allowed vlan 10,20
   switchport mode trunk
   switchport
   mlag 5
!
interface Ethernet1
   description MLAG_spine1_Ethernet1
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description MLAG_spine1_Ethernet2
   no shutdown
   channel-group 1 mode active
!
interface Ethernet3
   description L2_leaf1_Ethernet4
   no shutdown
   channel-group 3 mode active
!
interface Ethernet4
   description L2_leaf2_Ethernet4
   no shutdown
   channel-group 3 mode active
!
interface Ethernet5
   description L2_leaf3_Ethernet4
   no shutdown
   channel-group 5 mode active
!
interface Ethernet6
   description L2_leaf4_Ethernet4
   no shutdown
   channel-group 5 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.1.252.2/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.12/24
!
interface Vlan10
   description DMZ
   no shutdown
   vrf VRF_A
   ip address 10.1.10.3/24
   ip virtual-router address 10.1.10.1
!
interface Vlan20
   description Internal
   no shutdown
   vrf VRF_A
   ip address 10.1.20.3/24
   ip virtual-router address 10.1.20.1
!
interface Vlan3009
   description MLAG_L3_VRF_VRF_A
   no shutdown
   mtu 1500
   vrf VRF_A
   ip address 10.1.253.3/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.1.253.1/31
!
ip virtual-router mac-address 00:1c:73:00:dc:01
!
ip routing
no ip routing vrf MGMT
ip routing vrf VRF_A
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.1.253.2/31
!
mlag configuration
   domain-id SPINES
   local-interface Vlan4094
   peer-address 10.1.253.0
   peer-link Port-Channel1
   reload-delay mlag 300
   reload-delay non-mlag 330
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
end
