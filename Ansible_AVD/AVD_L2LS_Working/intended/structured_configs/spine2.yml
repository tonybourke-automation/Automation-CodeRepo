aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: MLAG_spine1_Ethernet1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  peer: spine1
  peer_interface: Ethernet1
  peer_type: mlag_peer
- name: Ethernet2
  description: MLAG_spine1_Ethernet2
  shutdown: false
  channel_group:
    id: 1
    mode: active
  peer: spine1
  peer_interface: Ethernet2
  peer_type: mlag_peer
- name: Ethernet3
  description: L2_leaf1_Ethernet4
  shutdown: false
  channel_group:
    id: 3
    mode: active
  peer: leaf1
  peer_interface: Ethernet4
  peer_type: l2leaf
- name: Ethernet4
  description: L2_leaf2_Ethernet4
  shutdown: false
  channel_group:
    id: 3
    mode: active
  peer: leaf2
  peer_interface: Ethernet4
  peer_type: l2leaf
- name: Ethernet5
  description: L2_leaf3_Ethernet4
  shutdown: false
  channel_group:
    id: 5
    mode: active
  peer: leaf3
  peer_interface: Ethernet4
  peer_type: l2leaf
- name: Ethernet6
  description: L2_leaf4_Ethernet4
  shutdown: false
  channel_group:
    id: 5
    mode: active
  peer: leaf4
  peer_interface: Ethernet4
  peer_type: l2leaf
hostname: spine2
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:dc:01
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.1.252.2/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.12/24
  type: oob
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: FABRIC
mlag_configuration:
  domain_id: SPINES
  local_interface: Vlan4094
  peer_address: 10.1.253.0
  peer_link: Port-Channel1
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
port_channel_interfaces:
- name: Port-Channel1
  description: MLAG_spine1_Port-Channel1
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel3
  description: L2_mlag1_Port-Channel3
  shutdown: false
  mlag: 3
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: '10'
- name: Port-Channel5
  description: L2_mlag2_Port-Channel3
  shutdown: false
  mlag: 5
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: '10'
prefix_lists:
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.1.253.2/31
route_maps:
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 4096
  no_spanning_tree_vlan: 4093-4094
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.1.253.1/31
  mtu: 1500
  no_autostate: true
- name: Vlan10
  description: DMZ
  shutdown: false
  vrf: VRF_A
  ip_address: 10.1.10.3/24
  ip_virtual_router_addresses:
  - 10.1.10.1
  tenant: TENANT_A
- name: Vlan3009
  description: MLAG_L3_VRF_VRF_A
  shutdown: false
  vrf: VRF_A
  ip_address: 10.1.253.3/31
  mtu: 1500
  tenant: TENANT_A
  type: underlay_peering
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  tenant: system
- id: 10
  name: DMZ
  tenant: TENANT_A
- id: 3009
  name: MLAG_L3_VRF_VRF_A
  trunk_groups:
  - MLAG
  tenant: TENANT_A
vrfs:
- name: MGMT
  ip_routing: false
- name: VRF_A
  ip_routing: true
  tenant: TENANT_A
