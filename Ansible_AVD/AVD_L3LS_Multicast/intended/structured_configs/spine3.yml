aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet3
  description: P2P_leaf1_Ethernet5
  shutdown: false
  mtu: 1500
  ip_address: 192.168.103.4/31
  pim:
    ipv4:
      sparse_mode: true
  peer: leaf1
  peer_interface: Ethernet5
  peer_type: l3leaf
  sflow:
    enable: true
  switchport:
    enabled: false
- name: Ethernet4
  description: P2P_leaf2_Ethernet5
  shutdown: false
  mtu: 1500
  ip_address: 192.168.103.12/31
  pim:
    ipv4:
      sparse_mode: true
  peer: leaf2
  peer_interface: Ethernet5
  peer_type: l3leaf
  sflow:
    enable: true
  switchport:
    enabled: false
- name: Ethernet5
  description: P2P_leaf3_Ethernet5
  shutdown: false
  mtu: 1500
  ip_address: 192.168.103.20/31
  pim:
    ipv4:
      sparse_mode: true
  peer: leaf3
  peer_interface: Ethernet5
  peer_type: l3leaf
  sflow:
    enable: true
  switchport:
    enabled: false
- name: Ethernet6
  description: P2P_leaf4_Ethernet5
  shutdown: false
  mtu: 1500
  ip_address: 192.168.103.28/31
  pim:
    ipv4:
      sparse_mode: true
  peer: leaf4
  peer_interface: Ethernet5
  peer_type: l3leaf
  sflow:
    enable: true
  switchport:
    enabled: false
hostname: spine3
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 192.168.101.13/32
management_api_gnmi:
  provider: eos-native
  transport:
    grpc:
    - name: EOS_gNMI
      vrf: MGMT
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.13/24
  type: oob
metadata:
  is_deployed: true
  platform: vEOS-lab
  pod_name: POD1
  dc_name: DC1
  fabric_name: FABRIC
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: DC1
    - name: topology_hint_fabric
      value: FABRIC
    - name: topology_hint_pod
      value: POD1
    - name: topology_hint_type
      value: spine
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 192.168.101.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 1200
    min_rx: 1200
    multiplier: 3
router_bgp:
  as: '65001'
  router_id: 192.168.101.13
  maximum_paths:
    paths: 4
    ecmp: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    type: ipv4
    send_community: all
    maximum_routes: 12000
  - name: EVPN-OVERLAY-PEERS
    type: evpn
    next_hop_unchanged: true
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 192.168.103.5
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    peer: leaf1
    description: leaf1_Ethernet5
  - ip_address: 192.168.103.13
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65100'
    peer: leaf2
    description: leaf2_Ethernet5
  - ip_address: 192.168.103.21
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65299'
    peer: leaf3
    description: leaf3_Ethernet5
  - ip_address: 192.168.103.29
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65299'
    peer: leaf4
    description: leaf4_Ethernet5
  - ip_address: 192.168.101.1
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    peer: leaf1
    description: leaf1_Loopback0
  - ip_address: 192.168.101.2
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65100'
    peer: leaf2
    description: leaf2_Loopback0
  - ip_address: 192.168.101.3
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65299'
    peer: leaf3
    description: leaf3_Loopback0
  - ip_address: 192.168.101.4
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65299'
    peer: leaf4
    description: leaf4_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
router_multicast:
  ipv4:
    routing: true
service_routing_protocols_model: multi-agent
sflow:
  sample: 4096
  vrfs:
  - name: VRF_A
    destinations:
    - destination: 127.0.0.1
    source_interface: loopback0
  destinations:
  - destination: 127.0.0.1
  source_interface: loopback0
  run: true
spanning_tree:
  mode: none
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
snmp_settings:
  vrfs:
  - name: MGMT
    enable: true
  users:
  - name: snmp
    group: null
    version: v2c
    auth: md5
    auth_passphrase: arista123
    priv: aes256
  communities:
  - name: EOS_snmp
    access: ro
