ip routing

router ospf 10
   router-id 192.168.101.2

interface Ethernet3
   no switchport
   ip address unnumbered loopback 0
   ip ospf area 0
   ip ospf network point-to-point
   mtu 1500

interface Ethernet4
   no switchport
   ip address unnumbered loopback 0
   ip ospf area 0
   ip ospf network point-to-point
   mtu 1500

interface Ethernet5
   no switchport
   ip address unnumbered loopback 0
   ip ospf area 0
   ip ospf network point-to-point
   mtu 1500

interface Ethernet6
   no switchport
   ip address unnumbered loopback 0
   ip ospf area 0
   ip ospf network point-to-point
   mtu 1500

interface loopback0
   ip address 192.168.101.2/32
   ip ospf area 0
   
interface loopback1
   ip address 192.168.102.2/32
   ip ospf area 0
   
